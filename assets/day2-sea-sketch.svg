  <g fill="#63816d" stroke="#55715f" stroke-width="1"><path d="M207 468 l-10 -16 l10 5 l7 -15 l6 24Z"/><path d="M245 429 l-7 -12 l8 4 l7 -12 l5 20Z"/><path d="M279 394 l-7 -12 l8 4 l7 -12 l5 19Z"/></g>
