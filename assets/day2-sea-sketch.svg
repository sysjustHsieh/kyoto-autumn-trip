<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
  <title id="title">天橋立與伊根舟屋手繪示意圖</title>
  <desc id="desc">天橋立 View Land、智惠之餅位於天橋立站附近；伊根灣觀光船與 INE CAFE 位於伊根，兩區以巴士往返。位置與距離僅供行程示意。</desc>
  <defs>
    <style>
      .ink{fill:none;stroke:#6d7b77;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .route{fill:none;stroke:#bd7155;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 12}
      .name{font:700 23px 'Noto Serif TC','PMingLiU',serif;fill:#354136}
      .sub{font:16px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#687263}
      .tiny{font:14px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#7e8674}
    </style>
    <pattern id="grain" width="41" height="43" patternUnits="userSpaceOnUse"><circle cx="9" cy="12" r="1" fill="#bfc5b7" opacity=".3"/><circle cx="31" cy="34" r="1.2" fill="#bfc5b7" opacity=".25"/></pattern>
  </defs>
  <rect x="8" y="8" width="584" height="684" rx="24" fill="#f8f6eb"/>
  <rect x="8" y="8" width="584" height="684" rx="24" fill="url(#grain)"/>
