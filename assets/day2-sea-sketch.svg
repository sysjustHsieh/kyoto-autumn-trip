  <path d="M48 617 Q292 622 552 616" class="ink" opacity=".35"/>
  <text x="51" y="648" class="tiny">※ 手繪位置示意・非比例尺</text>
  <text x="51" y="671" class="tiny">伊根遊覽船至 INE CAFE 約需步行 25 分鐘</text>
