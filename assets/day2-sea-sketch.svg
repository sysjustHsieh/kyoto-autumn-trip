  <g class="ink" opacity=".52"><path d="M389 489 q16 -7 31 0 M427 510 q15 -7 29 0 M479 478 q14 -8 29 0 M313 555 q13 -8 25 0 M511 367 q15 -7 26 0 M400 400 q13 -6 23 0"/></g>
