<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
  <title id="title">清水寺、御金神社與京都餐食手繪示意圖</title>
  <desc id="desc">清水寺位於鴨川以東；御金神社、然花抄院室町本店及三嶋亭本店位於市中心。位置與距離僅供行程示意。</desc>
  <defs>
    <style>
      .ink{fill:none;stroke:#777d69;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#c9cabb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .route{fill:none;stroke:#b85f4a;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 12}
      .name{font:700 23px 'Noto Serif TC','PMingLiU',serif;fill:#354136}
      .sub{font:16px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#687263}
      .tiny{font:14px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#7e8674}
    </style>
    <pattern id="grain" width="39" height="37" patternUnits="userSpaceOnUse"><circle cx="7" cy="11" r="1" fill="#c9c3ab" opacity=".35"/><circle cx="28" cy="30" r="1.3" fill="#c9c3ab" opacity=".25"/></pattern>
  </defs>
  <rect x="8" y="8" width="584" height="684" rx="24" fill="#faf6e9"/>
  <rect x="8" y="8" width="584" height="684" rx="24" fill="url(#grain)"/>
